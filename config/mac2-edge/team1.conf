log_format edge '$remote_addr [$time_local] "$request" $status '
                'upstream=$upstream_addr upstream_status=$upstream_status '
                'proto=$server_protocol tls=$ssl_protocol rt=$request_time';

upstream team1_backends {
    zone team1_backends 1m;
    server 10.7.2.33:3001  max_fails=1 fail_timeout=10s;   # Backend A (Mac 3)
    server 10.7.27.28:3002 max_fails=1 fail_timeout=10s;   # Backend B (Mac 4)
}

server {
    listen 80;
    server_name app.team1.test api.team1.test;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.team1.test api.team1.test;

    ssl_certificate     certs/app.team1.test.crt;
    ssl_certificate_key certs/app.team1.test.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:TLS:1m;
    ssl_session_timeout 10m;

    access_log /opt/homebrew/var/log/nginx/team1_access.log edge;
    error_log  /opt/homebrew/var/log/nginx/team1_error.log warn;

    location = /favicon.ico { access_log off; return 204; }

    location / {
        proxy_pass http://team1_backends;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout     2s;
        proxy_read_timeout        10s;
        proxy_next_upstream       error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        add_header X-Edge     "mac2-nginx" always;
        add_header X-Upstream $upstream_addr always;
    }
}
